<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05090d">
  <title>Modern Stadium | Almas Project</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --glass: rgba(5, 12, 18, .72);
      --line: rgba(255, 255, 255, .14);
      --accent: #5af0a3;
      --text: #f4fbff;
      --muted: #a9b9c5;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05090d;
      color: var(--text);
    }

    body {
      position: relative;
      touch-action: none;
    }

    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #05090d;
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      box-shadow: 0 12px 40px rgba(0,0,0,.32);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .topbar {
      position: fixed;
      z-index: 5;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 9px 8px 14px;
      border-radius: 17px;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(90,240,163,.85);
    }

    .title {
      margin: 0;
      overflow: hidden;
      font-size: 14px;
      font-weight: 780;
      letter-spacing: .07em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 7px;
      pointer-events: auto;
    }

    .player {
      max-width: min(35vw, 180px);
      overflow: hidden;
      padding: 8px 11px;
      border: 1px solid rgba(90,240,163,.23);
      border-radius: 999px;
      background: rgba(90,240,163,.08);
      color: #d8ffea;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.07);
      color: #fff;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    button:active {
      transform: scale(.95);
      background: rgba(255,255,255,.14);
    }

    button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .loading {
      position: fixed;
      z-index: 8;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 43%, rgba(38,128,90,.2), transparent 28%),
        #05090d;
      transition: opacity .55s ease, visibility .55s ease;
    }

    .loading.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .loader-card {
      width: min(390px, 100%);
      padding: 25px;
      border-radius: 23px;
      text-align: center;
    }

    .ring {
      position: relative;
      width: 62px;
      height: 62px;
      margin: 0 auto 18px;
      border: 2px solid rgba(255,255,255,.1);
      border-radius: 50%;
    }

    .ring::before {
      position: absolute;
      inset: -2px;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-radius: 50%;
      content: "";
      animation: spin .9s linear infinite;
      filter: drop-shadow(0 0 8px rgba(90,240,163,.6));
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-card h1 {
      margin: 0;
      font-size: clamp(21px, 5vw, 27px);
      letter-spacing: -.02em;
    }

    .loader-card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .fallback {
      position: fixed;
      z-index: 4;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 9px 12px;
      border-radius: 13px;
      color: #c7d5df;
      font-size: 12px;
      text-decoration: none;
      opacity: .68;
    }

    .fallback:hover { opacity: 1; }

    @media (max-width: 620px) {
      .subtitle { display: none; }
      .player { max-width: 28vw; }
      .topbar { min-height: 47px; }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .topbar {
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));
        right: max(6px, env(safe-area-inset-right));
      }
      .fallback {
        left: max(6px, env(safe-area-inset-left));
        bottom: max(6px, env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring::before { animation-duration: 1.8s; }
    }
  </style>
</head>
<body>
  <iframe
    id="viewer"
    title="Modern Stadium 3D"
    src="https://sketchfab.com/models/21767e058e9e4df8a1c57352611756aa/embed?autostart=1&amp;preload=1&amp;ui_theme=dark&amp;ui_infos=0&amp;ui_inspector=0&amp;ui_help=0&amp;ui_settings=1&amp;ui_watermark=1&amp;ui_watermark_link=1&amp;ui_ar=0&amp;ui_vr=0&amp;dnt=1"
    allow="autoplay; fullscreen; xr-spatial-tracking"
    allowfullscreen
  ></iframe>

  <header class="topbar glass">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <p class="title">Modern Stadium</p>
        <p class="subtitle">Сапа құрылғыға автоматты бейімделеді</p>
      </div>
    </div>
    <div class="actions">
      <span class="player" id="player-name">Ойыншы</span>
      <button id="fullscreen" type="button" aria-label="Толық экран" title="Толық экран">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"></path>
        </svg>
      </button>
    </div>
  </header>

  <a class="fallback glass" href="https://sketchfab.com/3d-models/modern-stadium-21767e058e9e4df8a1c57352611756aa" target="_blank" rel="noopener noreferrer">3D ашылмаса, осы жерді басыңыз</a>

  <section class="loading" id="loading" aria-live="polite">
    <div class="loader-card glass">
      <div class="ring" aria-hidden="true"></div>
      <h1>Стадион ашылуда</h1>
      <p>Жоғары сапалы 3D көрініс құрылғыңызға бейімделіп жатыр</p>
    </div>
  </section>

  <script>
    (function () {
      const accessKey = 'almas_stadium_access';
      const accessRaw = sessionStorage.getItem(accessKey);

      if (!accessRaw) {
        window.location.replace('./');
        return;
      }

      try {
        const access = JSON.parse(accessRaw);
        if (access && access.username) {
          document.getElementById('player-name').textContent = access.username;
        }
      } catch (_) {
        document.getElementById('player-name').textContent = 'Ойыншы';
      }

      const viewer = document.getElementById('viewer');
      const loading = document.getElementById('loading');

      viewer.addEventListener('load', function () {
        setTimeout(function () {
          loading.classList.add('hidden');
        }, 650);
      });

      setTimeout(function () {
        loading.classList.add('hidden');
      }, 9000);

      document.getElementById('fullscreen').addEventListener('click', async function () {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          }
        } catch (_) {
          // The browser may block fullscreen; the 3D view stays usable.
        }
      });
    }());
  </script>
</body>
</html>
