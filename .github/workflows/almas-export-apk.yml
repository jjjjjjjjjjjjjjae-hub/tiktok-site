name: Export Almas APK

on:
  push:
    branches: [almas-remote-build]
    paths:
      - '.github/workflows/almas-export-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: almas-remote-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: almas-remote-build/android-host
        run: gradle --no-daemon :app:assembleDebug
      - name: Export APK as compressed chunked text
        shell: bash
        run: |
          APK=almas-remote-build/android-host/app/build/outputs/apk/debug/app-debug.apk
          gzip -9 -c "$APK" > almas-remote-build/Almas_Remote_Host.apk.gz
          base64 -w0 almas-remote-build/Almas_Remote_Host.apk.gz > almas-remote-build/Almas_Remote_Host.apk.gz.b64
          fold -w 500 almas-remote-build/Almas_Remote_Host.apk.gz.b64 > almas-remote-build/Almas_Remote_Host.apk.gz.b64.lines
          sha256sum "$APK" > almas-remote-build/Almas_Remote_Host.apk.sha256.txt
          sha256sum almas-remote-build/Almas_Remote_Host.apk.gz > almas-remote-build/Almas_Remote_Host.apk.gz.sha256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almas-remote-build/Almas_Remote_Host.apk.gz.b64 almas-remote-build/Almas_Remote_Host.apk.gz.b64.lines almas-remote-build/Almas_Remote_Host.apk.sha256.txt almas-remote-build/Almas_Remote_Host.apk.gz.sha256.txt
          git commit -m 'Export compressed Almas Remote APK' || true
          git push origin HEAD:almas-remote-build
