name: Build Almas Remote V2.8 Keyboard

on:
  push:
    branches: [almas-remote-build]
    paths:
      - 'almas-remote-build/**'
      - '.github/workflows/almas-remote-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35 and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - name: Build ARM64 root uinput helper
        working-directory: almas-remote-build/android-host
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            native/uinput_helper.c -O2 -fPIE -pie -Wall -Wextra \
            -o app/src/main/assets/almas_uinput
          file app/src/main/assets/almas_uinput
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V2.3 Android root/video patch
        working-directory: almas-remote-build/android-host
        run: python patch_v23_android.py
      - name: Apply V2.4 automatic screen share permission patch
        working-directory: almas-remote-build/android-host
        run: python patch_v24_android.py
      - name: Apply V2.7 HQ native-resolution JPEG88 patch
        working-directory: almas-remote-build/android-host
        run: python patch_v27_hq.py
      - name: Apply V2.8 Unicode keyboard patch
        working-directory: almas-remote-build/android-host
        run: python patch_v28_keyboard.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build signed non-debuggable Release APK
        working-directory: almas-remote-build/android-host
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS_REMOTE_V28_KEYBOARD_HOST_APK
          path: almas-remote-build/android-host/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V2.1 orientation patch
        working-directory: almas-remote-build/windows-v2
        run: python patch_v21.py
      - name: Apply V2.2 Synaptics click/fallback patch
        working-directory: almas-remote-build/windows-v2
        run: python patch_v22.py
      - name: Apply V2.3 low latency video patch
        working-directory: almas-remote-build/windows-v2
        run: python patch_v23.py
      - name: Apply V2.8 Unicode keyboard patch
        working-directory: almas-remote-build/windows-v2
        run: python patch_v28_keyboard.py
      - name: Publish native Windows client
        working-directory: almas-remote-build/windows-v2
        run: dotnet publish AlmasRemoteV2.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=2.8.0 -p:FileVersion=2.8.0.0 -p:AssemblyVersion=2.8.0.0 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS_REMOTE_V28_KEYBOARD_CLIENT_EXE
          path: almas-remote-build/windows-v2/publish/Almas Remote V2.exe
          if-no-files-found: error
