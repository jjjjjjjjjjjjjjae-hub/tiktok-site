name: Build Almas Remote V2.1

on:
  push:
    branches: [almas-remote-build]
    paths:
      - 'almas-remote-build/**'
      - '.github/workflows/almas-remote-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: almas-remote-build/android-host
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS_REMOTE_V21_HOST_APK
          path: almas-remote-build/android-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V2.1 client patch
        working-directory: almas-remote-build/windows-v2
        run: python patch_v21.py
      - name: Publish native Windows client
        working-directory: almas-remote-build/windows-v2
        run: dotnet publish AlmasRemoteV2.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS_REMOTE_V21_CLIENT_EXE
          path: almas-remote-build/windows-v2/publish/Almas Remote V2.exe
          if-no-files-found: error
