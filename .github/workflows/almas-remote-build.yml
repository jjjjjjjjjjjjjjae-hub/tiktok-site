name: Build Almas Remote

on:
  push:
    branches: [almas-remote-build]
    paths:
      - 'almas-remote-build/**'
      - '.github/workflows/almas-remote-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: almas-remote-build/android-host
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS_REMOTE_HOST_APK
          path: almas-remote-build/android-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Build EXE
        working-directory: almas-remote-build/windows-client
        run: pyinstaller --noconfirm --onefile --windowed --add-data "joystick.jpg;." --name 'Almas Remote Client' almas_remote_client.py
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS_REMOTE_CLIENT_EXE
          path: almas-remote-build/windows-client/dist/Almas Remote Client.exe
          if-no-files-found: error
