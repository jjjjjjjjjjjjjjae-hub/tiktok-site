name: Capture Almas Android Log

on:
  push:
    branches: [almas-remote-build]
    paths:
      - '.github/workflows/almas-remote-android-log.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: almas-remote-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build and capture
        working-directory: almas-remote-build/android-host
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > build.log 2>&1
          code=$?
          echo "$code" > build-exit-code.txt
          exit 0
      - name: Commit build log
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almas-remote-build/android-host/build.log almas-remote-build/android-host/build-exit-code.txt
          git commit -m 'Capture Android build log' || true
          git push origin HEAD:almas-remote-build
