name: Diagnose Almas Remote Android

on:
  push:
    branches: [almas-remote-build]
    paths:
      - '.github/workflows/almas-remote-android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build and capture log
        working-directory: almas-remote-build/android-host
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > build.log 2>&1
          code=$?
          cat build.log
          echo "$code" > build-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS_ANDROID_BUILD_LOG
          path: |
            almas-remote-build/android-host/build.log
            almas-remote-build/android-host/build-exit-code.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS_REMOTE_HOST_APK_DEBUG
          path: almas-remote-build/android-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
