name: Check secure invite system

on:
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "app-config.js"
      - "auth-worker/**"
      - ".github/workflows/check-secure-invite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check auth-worker/src/worker.js
      - name: Check inline application script
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];if(m.length!==1)throw Error('inline script missing');new Function(m[0][1]);"

